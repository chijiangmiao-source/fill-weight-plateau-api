services:
  api:
    build: .
    ports:
      # 宿主端口可用环境变量 API_PORT 覆盖，默认 8000
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # 一次性验证服务：运行完整测试套件后以测试退出码结束
  verify:
    build: .
    command: ["python", "-m", "pytest", "-v"]
    restart: "no"
